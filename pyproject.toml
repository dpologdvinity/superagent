[project]
name = "wish-recovery"
version = "0.1.0"
description = "What Does a Wish Leave Out? Requirement recovery in wish-driven code agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Yanhao Bai" },
  { name = "Kaitlyn Bassford" },
  { name = "Wen Tao Koh" },
]
dependencies = [
  "huggingface_hub>=0.26",
  "numpy>=1.26",
  "pyarrow>=16",
  "pytest>=8",
  "pyyaml>=6",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
